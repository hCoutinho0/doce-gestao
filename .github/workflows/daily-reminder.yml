name: Lembrete diário de tarefas

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília (sem horário de verão).
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar lembretes
        run: |
          curl -sf -X POST "https://confeitto.com.br/api/reminders/daily" \
            -H "X-Reminder-Secret: ${{ secrets.REMINDER_CRON_SECRET }}"
